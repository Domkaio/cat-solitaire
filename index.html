<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10122d"><title>Cat Solitarie</title><link rel="icon" href="felisnoc.png"><link rel="stylesheet" href="style.css"></head>
<body><canvas id="sky" aria-hidden="true"></canvas>
<header><strong><img src="felisnoc.png" alt=""> Cat Solitarie</strong><nav><button id="sound" aria-pressed="true">Som ligado</button><button id="help" aria-label="Como jogar">?</button></nav></header>
<section id="lobby"><div class="hero-copy"><small>PACIÊNCIA SPIDER</small><h1>Cat<br><i>Solitarie</i></h1><p>Do rei ao ás, uma carta de cada vez.</p><div class="choices"><button id="play">Jogar agora <span>♠</span></button><button id="resume" hidden>Continuar</button></div><button id="records">♜ &nbsp; Recordes locais</button></div>
<div class="fan" aria-hidden="true"><div class="poster left"><label>Q ♥</label><b>♥</b></div><div class="poster right"><label>K ♣</label><b>♣</b></div><div class="poster center"><label>A ♠</label><div class="seal"><img src="felisnoc.png" alt=""></div><i>Cat Solitarie</i><label>A ♠</label></div></div></section>
<main id="table" hidden><div class="tools"><button id="home">‹ Lobby</button><div class="metrics"><b class="metric" data-caption="Tempo" id="time" title="Tempo"></b><span>·</span><b class="metric" data-caption="Pontos"><span id="score"></span></b><span>·</span><b class="metric" data-caption="Sequências" id="progress" title="Sequências completas"></b></div><button id="deal" title="Distribuir uma carta em cada coluna"><span class="deck-icon" aria-hidden="true">♠</span><span><b>Comprar 10</b><small id="count"></small></span></button></div><div class="board-window"><div id="board"></div></div><aside id="stalled" role="status" hidden><strong>Sem jogadas disponíveis</strong><button id="rewind">↶ Retroceder</button><button id="restart">Nova partida</button></aside><footer><button id="undo">↶ Desfazer</button><span>✧</span><button id="hint">☼ Dica</button><button id="settings" aria-label="Configurações" title="Configurações">⚙</button></footer><p id="note" role="status"></p></main>
<dialog><section id="preferences" hidden><h2>Configurações</h2><label class="size-control">Cartas <select id="size" aria-label="Tamanho das cartas"><option value="80">Pequenas</option><option value="100" selected>Médias</option><option value="125">Grandes</option></select></label><button id="audioPref"></button><label class="level">Volume dos efeitos <input type="range" id="volume" min="0" max="100"></label><label class="level">Música de fundo <input type="range" id="musicLevel" min="0" max="100"></label><div class="previews"><button id="previewTap">Ouvir carta</button><button id="previewDeal">Ouvir compra</button><button id="previewHint">Ouvir dica</button></div></section><article></article><button id="close">Voltar</button></dialog><script src="game.js"></script></body></html>
