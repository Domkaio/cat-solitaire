<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10372e"><title>Cat Solitarie</title><link rel="icon" href="felisnoc.png"><link rel="stylesheet" href="style.css"></head>
<body><canvas id="sky" aria-hidden="true"></canvas>
<header><strong><img src="felisnoc.png" alt=""> Cat Solitarie</strong><nav><button id="sound" aria-pressed="true">Som ligado</button><button id="help" aria-label="Como jogar">?</button></nav></header>
<section id="lobby"><div class="hero-copy"><small>PACIÊNCIA SPIDER</small><h1>Cat<br><i>Solitarie</i></h1><p>Do rei ao ás, uma carta de cada vez.</p><div class="choices"><button id="play">Jogar agora <span>♠</span></button><button id="resume" hidden>Continuar</button></div><button id="records">♜ &nbsp; Recordes locais</button></div>
<div class="fan" aria-hidden="true"><div class="poster left"><label>Q ♥</label><b>♥</b></div><div class="poster right"><label>K ♣</label><b>♣</b></div><div class="poster center"><label>A ♠</label><div class="seal"><img src="felisnoc.png" alt=""></div><i>Cat Solitarie</i><label>A ♠</label></div></div></section>
<main id="table" hidden><div class="tools"><button id="home">‹ Lobby</button><div class="metrics"><b id="time" title="Tempo"></b><span>·</span><b><span id="score"></span> pts</b><span>·</span><b id="progress" title="Sequências completas"></b></div><button id="deal" aria-label="Distribuir dez cartas">▤ <strong id="count"></strong></button></div><div id="board"></div><footer><button id="undo">↶ Desfazer</button><span>✧</span><button id="hint">☼ Dica</button></footer><p id="note" role="status"></p></main>
<dialog><article></article><button id="close">Voltar</button></dialog><script src="game.js"></script></body></html>
